name: kids_tv
description: A simple mobile app for kids to watch videos with parental controls
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  youtube_player_flutter: ^9.0.0
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  intl: ^0.18.1
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0
  firebase_core: ^3.8.1
  firebase_analytics: ^11.4.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.1
  image_picker: ^1.0.7
  firebase_storage: ^12.0.0
  # Binaural beats support
  just_audio: ^0.9.36
  audio_session: ^0.1.18

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/audio/

